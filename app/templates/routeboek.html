<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routeboek routes – GPX Drinkwaterpunten</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/style.css?v={{ app_version }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
</head>
<body>
<header>
  <div>
    <h1>💧 Routeboek routes</h1>
    <p>Kies een route van routeboek.cc/club/{{ club_slug }} en voeg waterpunten toe of controleer hem op wegwerkzaamheden, verboden paden en regen.</p>
  </div>
  <nav>
    <a href="/">GPX upload</a>
    {% if strava_visible %}<a href="/strava">Strava routes</a>{% endif %}
    <a href="/routeboek" class="active">Routeboek routes</a>
  </nav>
</header>

<main>
  <section class="panel">
    <div id="route-box">
      <label>Routes <span id="route-count" class="muted"></span></label>
      <input type="search" id="route-search" placeholder="Zoek op naam…" autocomplete="off">
      <div class="toolbar">
        <button type="button" id="refresh-routes" class="secondary">Vernieuw lijst</button>
        <button type="button" id="select-all" class="secondary">Alles aan/uit</button>
      </div>
      <ul id="routes" class="routes"></ul>

      {% include "_checks.html" %}


      <button type="button" id="process-btn">Controleer route</button>
      <p id="status" class="status"></p>
    </div>

    <div id="results" hidden>
      <h2>Resultaten</h2>
      <ul id="result-list" class="results"></ul>
    </div>
  </section>

  <section class="map-wrap">
    <div id="map"></div>
  </section>
</main>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/legality.js?v={{ app_version }}"></script>
<script src="/static/weather.js?v={{ app_version }}"></script>
<script src="/static/checks.js?v={{ app_version }}"></script>
<script src="/static/routeboek.js?v={{ app_version }}"></script>
</body>
</html>
